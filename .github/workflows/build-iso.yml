          test "$(readlink -f "$ROOT/usr/share/plymouth/themes/text.plymouth")" = \
            "$ROOT/usr/share/plymouth/themes/trebo-text/trebo-text.plymouth"
          grep -q '^title=Trebo Linux 1.0          grep -E '^GRUB_CMDLINE_LINUX_DEFAULT=.*splash' "$ROOT/etc/default/grub"

          test ! -s "$ROOT/etc/machine-id"
          test -L "$ROOT/etc/resolv.conf"
