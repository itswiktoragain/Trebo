name: Build Trebo ISO

on:
  push:
    branches:
      - main
    paths:
      - build-trebo.sh
      - assets/**
      - .github/workflows/build-iso.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trebo-iso-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Check out Trebo
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h /

      - name: Install remaster tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorriso squashfs-tools curl librsvg2-bin initramfs-tools-core

      - name: Safety-check remaster script
        shell: bash
        run: |
          set -Eeuo pipefail

          bash -n ./build-trebo.sh

          awk '/^cat > .*CHROOT_EOF/ {inside=1; next} /^CHROOT_EOF$/ {inside=0} inside' \
            ./build-trebo.sh > /tmp/trebo-customize-check.sh
          test -s /tmp/trebo-customize-check.sh
          bash -n /tmp/trebo-customize-check.sh

          python3 - <<'PY_STATIC'
          from pathlib import Path
          import re

          text = Path("build-trebo.sh").read_text()
          markers = sorted(set(re.findall(r"<<'((?:PY_)[A-Z0-9_]+)'", text)))
          if not markers:
              raise SystemExit("No embedded Python heredocs found")

          for marker in markers:
              opener = f"<<'{marker}'"
              start = text.find(opener)
              if start < 0:
                  raise SystemExit(f"Missing opener for {marker}")
              start = text.find("\n", start) + 1
              end = text.find(f"\n{marker}", start)
              if end < 0:
                  raise SystemExit(f"Missing terminator for {marker}")
              compile(text[start:end], marker, "exec")
              print(f"Compiled embedded Python: {marker}")
          PY_STATIC

          grep -q '^DISTRIB_CODENAME=noble$' ./build-trebo.sh

          if grep -nE '^[[:space:]]*apt(-get)?[[:space:]].*(remove|purge|autoremove)' ./build-trebo.sh; then
            echo "Refusing to build: broad package-removal command found."
            exit 1
          fi

          grep -Fq 'BOOT=casper update-initramfs -c -k "$KVER"' ./build-trebo.sh
          grep -Fq 'trebo-text.plymouth' ./build-trebo.sh
          grep -Fq 'title=Trebo Linux 1.0' ./build-trebo.sh
          grep -Fq 'GdkPixbuf.Pixbuf.new_from_file' ./build-trebo.sh
          grep -Fq 'trebo-install-details' ./build-trebo.sh

          if grep -Fq 'preserving the existing validated Casper ISO initrd' ./build-trebo.sh; then
            echo "Refusing to build: quick mode can still reuse a stale Casper initrd."
            exit 1
          fi

      - name: Build Trebo
        shell: bash
        run: |
          sudo bash ./build-trebo.sh

      - name: Re-run quick mode for idempotence
        shell: bash
        run: |
          sudo bash ./build-trebo.sh --quick

      - name: Verify output and rootfs invariants
        shell: bash
        run: |
          set -Eeuo pipefail

          ROOT=trebo-work/rootfs
          ISO=trebo-work/iso

          sha256sum -c Trebo-radiant-redpanda-1.0.iso.sha256
          xorriso -indev Trebo-radiant-redpanda-1.0.iso -report_el_torito plain
          ls -lh Trebo-radiant-redpanda-1.0.iso Trebo-radiant-redpanda-1.0.iso.sha256

          test -x "$ROOT/usr/lib/ubiquity/target-config/99trebo-installed"
          test -x "$ROOT/usr/lib/ubiquity/trebo-finalize-target"
          test -x "$ROOT/usr/lib/trebo/trebo-updater.py"

          grep -q '^BOOT=local$' "$ROOT/etc/initramfs-tools/initramfs.conf"
          grep -q '^Theme=trebo$' "$ROOT/etc/plymouth/plymouthd.conf"

          test "$(readlink -f "$ROOT/usr/share/plymouth/themes/default.plymouth")" = \
            "$ROOT/usr/share/plymouth/themes/trebo/trebo.plymouth"

          test "$(readlink -f "$ROOT/usr/share/plymouth/themes/text.plymouth")" = \
            "$ROOT/usr/share/plymouth/themes/trebo-text/trebo-text.plymouth"

          grep -q '^title=Trebo Linux 1.0$' \
            "$ROOT/usr/share/plymouth/themes/trebo-text/trebo-text.plymouth"

          if grep -q '^title=Ubuntu' \
            "$ROOT/usr/share/plymouth/themes/trebo-text/trebo-text.plymouth"; then
            echo "Trebo text Plymouth fallback still contains Ubuntu branding."
            exit 1
          fi

          grep -E '^GRUB_CMDLINE_LINUX_DEFAULT=.*splash' "$ROOT/etc/default/grub"

          test -f "$ISO/casper/initrd"
          lsinitramfs "$ISO/casper/initrd" > /tmp/trebo-initrd.list

          grep -Fxq 'scripts/casper' /tmp/trebo-initrd.list
          grep -Fq 'usr/share/plymouth/themes/trebo/trebo.plymouth' /tmp/trebo-initrd.list
          grep -Fq 'usr/share/plymouth/themes/trebo/trebo.script' /tmp/trebo-initrd.list
          grep -Fq 'usr/share/plymouth/themes/trebo/background.png' /tmp/trebo-initrd.list
          grep -Fq 'usr/share/plymouth/themes/trebo-text/trebo-text.plymouth' /tmp/trebo-initrd.list
          grep -Eq '/plymouth/script\.so$' /tmp/trebo-initrd.list

          found_casper_boot=0
          for boot_file in \
            "$ISO/boot/grub/grub.cfg" \
            "$ISO/boot/grub/loopback.cfg" \
            "$ISO/isolinux/txt.cfg" \
            "$ISO/isolinux/menu.cfg" \
            "$ISO/isolinux/isolinux.cfg"
          do
            [[ -f "$boot_file" ]] || continue
            if grep -q 'boot=casper' "$boot_file"; then
              found_casper_boot=1
              grep 'boot=casper' "$boot_file" | grep -Eq '(^|[[:space:]])splash([[:space:]]|$)'
              grep 'boot=casper' "$boot_file" | grep -Eq '(^|[[:space:]])noprompt([[:space:]]|$)'
            fi
          done
          test "$found_casper_boot" -eq 1

      - name: Upload Trebo ISO
        uses: actions/upload-artifact@v4
        with:
          name: Trebo-radiant-redpanda-1.0
          path: |
            Trebo-radiant-redpanda-1.0.iso
            Trebo-radiant-redpanda-1.0.iso.sha256
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
